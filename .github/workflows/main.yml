name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project
        run: unzip -q ride-home.zip -d unpacked
      - name: Build debug APK
        working-directory: unpacked/ridehome
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ride-home-apk
          path: unpacked/ridehome/app/build/outputs/apk/debug/app-debug.apk
